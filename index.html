<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Live · Vota y Chatea</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="aurora-bg"></div>

  <header class="topbar">
    <div class="logo">
      <span class="logo-icon">🏢</span>
      <span class="logo-text">Office<span>Live</span></span>
    </div>
    <div class="user-profile" id="userProfile" hidden>
      <img id="headerAvatar" class="avatar" alt="Avatar" />
      <span id="headerName" class="user-name"></span>
      <button id="changeAvatarBtn" type="button" class="icon-btn" title="Cambiar avatar">✏️</button>
    </div>
    <button id="loginBtn" type="button" class="btn btn-primary">Entrar</button>
  </header>

  <main class="main-grid">
    <section class="panel">
      <div class="panel-header">
        <h2>🗳️ Votaciones de la Oficina</h2>
        <button id="newPollBtn" type="button" class="btn btn-accent">+ Nueva votación</button>
      </div>
      <div id="pollsContainer" class="polls-container">
        <p class="empty-state">Aún no hay votaciones. ¡Crea la primera! 🚀</p>
      </div>
    </section>

    <section class="panel chat-panel">
      <div class="panel-header">
        <h2>💬 Chat en vivo</h2>
        <span class="online-dot" title="Conectado"></span>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off" maxlength="300" />
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </section>
  </main>

  <!-- MODAL: Login -->
  <div id="loginModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>👋 ¡Bienvenido/a!</h2>
      <p>Elige tu nombre y un avatar para entrar a la sala de la oficina.</p>
      <label class="field-label">Tu nombre</label>
      <input id="nameInput" type="text" placeholder="Ej: Ana, Carlos..." maxlength="20" class="text-input" />
      <label class="field-label">Elige tu avatar</label>
      <div id="avatarGrid" class="avatar-grid"></div>
      <button id="enterBtn" type="button" class="btn btn-primary btn-block">Entrar a la oficina</button>
    </div>
  </div>

  <!-- MODAL: Crear votación -->
  <div id="pollModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>✨ Nueva votación</h2>
      <label class="field-label">Pregunta</label>
      <input id="pollQuestion" type="text" placeholder="Ej: ¿Prendemos el aire?" maxlength="120" class="text-input" />

      <!-- NUEVO: Checkbox para modo Sí/No -->
      <label class="checkbox-label">
        <input type="checkbox" id="isYesNoPoll" />
        <span>Modo Sí/No (Mascota animada)</span>
      </label>

      <div id="pollOptionsWrapper">
        <label class="field-label">Opciones (mínimo 2)</label>
        <div id="pollOptionsContainer">
          <input type="text" class="text-input poll-option" placeholder="Opción 1" maxlength="60" />
          <input type="text" class="text-input poll-option" placeholder="Opción 2" maxlength="60" />
        </div>
        <button id="addOptionBtn" type="button" class="btn btn-ghost">+ Añadir opción</button>
      </div>

      <button id="createPollBtn" type="button" class="btn btn-primary btn-block">Crear votación</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</body>
</html>
