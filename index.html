<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Live · Vota y Chatea</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Fuente moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Fondo animado -->
  <div class="aurora-bg"></div>

  <!-- Cabecera con perfil -->
  <header class="topbar">
    <div class="logo">
      <span class="logo-icon">🏢</span>
      <span class="logo-text">Office<span>Live</span></span>
    </div>
    <div class="user-profile" id="userProfile" hidden>
      <img id="headerAvatar" class="avatar" alt="Avatar" />
      <span id="headerName" class="user-name"></span>
      <button id="changeAvatarBtn" class="icon-btn" title="Cambiar avatar">✏️</button>
    </div>
    <button id="loginBtn" class="btn btn-primary">Entrar</button>
  </header>

  <!-- Layout principal -->
  <main class="main-grid">

    <!-- Panel de Votaciones -->
    <section class="panel">
      <div class="panel-header">
        <h2>🗳️ Votaciones</h2>
        <button id="newPollBtn" class="btn btn-accent">+ Nueva votación</button>
      </div>
      <div id="pollsContainer" class="polls-container">
        <!-- Las encuestas se renderizan aquí -->
        <p class="empty-state">Aún no hay votaciones. ¡Crea la primera! 🚀</p>
      </div>
    </section>

    <!-- Panel de Chat -->
    <section class="panel chat-panel">
      <div class="panel-header">
        <h2>💬 Chat en vivo</h2>
        <span class="online-dot" title="Conectado"></span>
      </div>
      <div id="chatMessages" class="chat-messages">
        <!-- Los mensajes se renderizan aquí -->
      </div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" placeholder="Escribe un mensaje..." autocomplete="off" maxlength="300" />
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </section>

  </main>

  <!-- MODAL: Login / Elegir avatar -->
  <div id="loginModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>👋 ¡Bienvenido/a!</h2>
      <p>Elige tu nombre y un avatar para entrar a la sala.</p>

      <label class="field-label">Tu nombre</label>
      <input id="nameInput" type="text" placeholder="Ej: Ana, Carlos..." maxlength="20" class="text-input" />

      <label class="field-label">Elige tu avatar</label>
      <div id="avatarGrid" class="avatar-grid">
        <!-- Se generan dinámicamente -->
      </div>

      <button id="enterBtn" class="btn btn-primary btn-block">Entrar a la oficina</button>
    </div>
  </div>

  <!-- MODAL: Crear votación -->
  <div id="pollModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2>✨ Nueva votación</h2>
      <label class="field-label">Pregunta</label>
      <input id="pollQuestion" type="text" placeholder="Ej: ¿Prendemos el aire?" maxlength="120" class="text-input" />

      <label class="field-label">Opciones (mínimo 2)</label>
      <div id="pollOptionsContainer">
        <input type="text" class="text-input poll-option" placeholder="Opción 1" maxlength="60" />
        <input type="text" class="text-input poll-option" placeholder="Opción 2" maxlength="60" />
      </div>
      <button id="addOptionBtn" class="btn btn-ghost">+ Añadir opción</button>

      <button id="createPollBtn" class="btn btn-primary btn-block">Crear votación</button>
    </div>
  </div>

  <!-- SDK de Firebase (modular v9) -->
  <script type="module" src="app.js"></script>
  <!-- Confetti para celebrar votos -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</body>
</html>
