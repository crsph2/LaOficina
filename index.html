<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Oficina</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Librerías externas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
</head>
<body>
    <header>
        <div class="avatar-container">
            <img id="avatar-img" src="https://via.placeholder.com/100" alt="Avatar">
            <input type="file" id="avatar-input" accept="image/*" style="display: none;">
            <button id="btn-edit-avatar">Editar Avatar</button>
        </div>
        <h1>Panel de la Oficina</h1>
    </header>

    <main>
        <!-- SECCIÓN CONTADORES -->
        <section class="card">
            <h2>Contadores</h2>
            <div class="counters">
                <div class="counter-item">
                    <h3>Próximo Viernes 29 de Enero</h3>
                    <p id="countdown-29">Calculando...</p>
                </div>
                <div class="counter-item">
                    <h3>Próximo Feriado (<span id="holiday-name">...</span>)</h3>
                    <p id="countdown-holiday">Calculando...</p>
                </div>
            </div>
        </section>

        <!-- SECCIÓN CUMPLEAÑOS -->
        <section class="card">
            <h2>Lista de Cumpleaños</h2>
            <p class="subtitle">Arrastra para ordenar. Haz doble clic en un nombre para editarlo.</p>
            <ul id="birthday-list"></ul>
            <form id="birthday-form">
                <input type="text" id="bday-name" placeholder="Nombre" required>
                <input type="date" id="bday-date" required>
                <button type="submit">Agregar</button>
            </form>
        </section>

        <!-- SECCIÓN AGUA -->
        <section class="card">
            <h2>Registro del Agua</h2>
            <p id="last-water-buyer">Último en comprar: Nadie</p>
            <form id="water-form">
                <input type="text" id="water-name" placeholder="¿Quién compró el agua?" required>
                <button type="submit">Registrar Compra</button>
            </form>
            <ul id="water-history"></ul>
        </section>
    </main>

    <!-- Modal para recortar avatar -->
    <div id="cropper-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="image-to-crop" src="" alt="Imagen a recortar">
            <button id="btn-save-avatar">Guardar Avatar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
